[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convergence-clubs"
version = "0.1.0"
description = "Phillips-Sul club convergence analysis: a Python port of the R package ConvergenceClubs"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Bernard Banyuls", email = "bbanyuls@ucm.es" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5"]
keywords = ["convergence", "club convergence", "phillips-sul", "log t test", "econometrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
interactive = ["plotly>=5.15"]
maps = ["geopandas>=0.14.4", "matplotlib>=3.7"]

[project.scripts]
convergence-clubs = "convergence_clubs.cli:main"

[project.urls]
Repository = "https://github.com/bbanyuls/club-convergence"
"Original R package" = "https://github.com/rhobis/ConvergenceClubs"

[dependency-groups]
# What the tests need; the minimum-versions CI job installs only this group,
# since pandas-stubs (for mypy) would pull numpy up to 1.26.
test = ["pytest>=8", "pytest-cov>=5", "matplotlib>=3.7", "statsmodels>=0.14", "scipy>=1.10", "plotly>=5.15", "geopandas>=0.14.4", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.25"]
dev = [{ include-group = "test" }, "ruff>=0.6", "mypy>=1.10", "pandas-stubs>=2.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/convergence_clubs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
files = ["src/convergence_clubs"]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["convergence_clubs"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 99
show_missing = true
