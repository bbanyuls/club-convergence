[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convergence-clubs"
version = "0.1.0"
description = "Phillips-Sul club convergence analysis: a Python port of the R package ConvergenceClubs"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Bernard Banyuls", email = "bbanyuls@ucm.es" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5"]
keywords = ["convergence", "club convergence", "phillips-sul", "log t test", "econometrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
interactive = ["plotly>=5.15"]

[project.scripts]
convergence-clubs = "convergence_clubs.cli:main"

[project.urls]
Repository = "https://github.com/bbanyuls/club-convergence"
"Original R package" = "https://github.com/rhobis/ConvergenceClubs"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.6", "statsmodels>=0.14", "scipy>=1.10", "plotly>=5.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/convergence_clubs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.format]
exclude = ["*.md"]
