name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # One job is enough: stub packages differ across the versions resolved
      # for each Python. mypy checks the code as Python 3.10 (pyproject.toml).
      - if: matrix.python-version == '3.13'
        run: uv run mypy
      - if: matrix.python-version == '3.13'
        name: Validate CITATION.cff
        run: uv run --with cffconvert cffconvert --validate
      - run: uv run pytest --cov --cov-report=term
